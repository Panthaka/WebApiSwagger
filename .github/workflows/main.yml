name: Publish Api

on:
  workflow_dispatch:
  push:
    branches:
      - master
jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./WebApiSwagger.slnx

      - name: Build
        run: dotnet build ./WebApiSwagger.slnx --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./WebApiSwagger.slnx --configuration release --no-build
